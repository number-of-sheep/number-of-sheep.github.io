---
layout: default
---
<article class="post-container">
    <header class="post-page-header">
        <h1 class="post-page-title">{{ page.title }}</h1>
        <div class="post-page-meta">
            <span class="post-date">{{ page.date | date: "%B %d, %Y" }}</span>
            {% if page.categories.size > 0 %}
            <span>&nbsp;&nbsp;&middot;&nbsp;&nbsp;</span>
            <span class="post-category-tag">{{ page.categories | first }}</span>
            {% endif %}
        </div>
    </header>

    <div class="post-content">
        {{ content }}
    </div>

    <footer class="post-page-footer">
        <hr class="footer-hr">
        <a href="/blog/" class="back-to-blog">&larr; Back to Blog List</a>
    </footer>
</article>
